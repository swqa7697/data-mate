name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Clean v<VERSION> tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-artifacts:
    # This environment must restrict eligible tags and access to signing secrets.
    environment: release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Require native arm64 and matching stable tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$REQUESTED_TAG" = "v$(cat VERSION)"
          test "$(git describe --exact-match --tags HEAD)" = "$REQUESTED_TAG"
      - name: Prepare pinned dependencies
        run: make setup
      - name: Build, sign and notarize
        env:
          APPLE_SIGNING_P12_BASE64: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d /tmp/data-mate-signing.XXXXXX)"
          signing_keychain="$signing_dir/release.keychain-db"
          signing_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_SIGNING_P12_BASE64" | base64 --decode > "$signing_dir/identity.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 3600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$signing_dir/identity.p12" -k "$signing_keychain" -P "$APPLE_SIGNING_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain"
          xcrun notarytool store-credentials data-mate-release --keychain "$signing_keychain" --apple-id "$APPLE_ID" --team-id JDNRPL924Q --password "$APPLE_APP_SPECIFIC_PASSWORD" >/dev/null
          export DATA_MATE_SIGNING_IDENTITY='Developer ID Application: Baiyi Liao (JDNRPL924Q)'
          export DATA_MATE_NOTARY_PROFILE=data-mate-release
          export DATA_MATE_NOTARY_KEYCHAIN="$signing_keychain"
          export DATA_MATE_RELEASE_OUTPUT="$RUNNER_TEMP/data-mate-release"
          ./scripts/release.sh
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: signed-release-candidate
          path: ${{ runner.temp }}/data-mate-release/
          if-no-files-found: error
          retention-days: 14
      # Publication remains a separate, explicit operator action after clean-host
      # acceptance and immutable-release configuration are verified.
