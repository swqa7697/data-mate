name: release-cache-signal

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate new stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_DELETED: ${{ github.event.deleted }}
        shell: bash
        run: |
          test "$TAG_CREATED" = true
          test "$TAG_DELETED" = false
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
