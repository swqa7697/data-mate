name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  quality-platform:
    name: Format and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Record native toolchain
        run: |
          uname -m
          go version
          go env GOOS GOARCH CGO_ENABLED
          if [[ "$(uname -s)" == Darwin ]]; then
            xcrun clang --version
            xcrun --show-sdk-path
          else
            cc --version
            getconf GNU_LIBC_VERSION
          fi
      - name: Prepare pinned dependencies and tools
        run: make setup
      - name: Check formatting
        run: make format-check
      - name: Lint
        run: make lint

  test-build-platform:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Record native toolchain
        run: |
          uname -m
          go version
          go env GOOS GOARCH CGO_ENABLED
          if [[ "$(uname -s)" == Darwin ]]; then
            xcrun clang --version
            xcrun --show-sdk-path
          else
            cc --version
            getconf GNU_LIBC_VERSION
          fi
      - name: Prepare pinned dependencies and tools
        run: make setup
      - name: Unit and regression tests
        run: make test
      - name: Build
        run: make build

  race-platform:
    name: Race tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Record native toolchain
        run: |
          uname -m
          go version
          go env GOOS GOARCH CGO_ENABLED
          if [[ "$(uname -s)" == Darwin ]]; then
            xcrun clang --version
            xcrun --show-sdk-path
          else
            cc --version
            getconf GNU_LIBC_VERSION
          fi
      - name: Prepare pinned dependencies and tools
        run: make setup
      - name: Race tests
        run: make test-race

  quality:
    name: Format and lint
    needs: quality-platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both platforms
        env:
          PLATFORM_RESULT: ${{ needs.quality-platform.result }}
        run: test "$PLATFORM_RESULT" = success

  test-build:
    name: Test and build
    needs: test-build-platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both platforms
        env:
          PLATFORM_RESULT: ${{ needs.test-build-platform.result }}
        run: test "$PLATFORM_RESULT" = success

  race:
    name: Race tests
    needs: race-platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both platforms
        env:
          PLATFORM_RESULT: ${{ needs.race-platform.result }}
        run: test "$PLATFORM_RESULT" = success
