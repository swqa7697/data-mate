name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  quality:
    name: Format and lint
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Record native toolchain
        run: |
          uname -m
          go version
          go env GOOS GOARCH CGO_ENABLED
          xcrun clang --version
          xcrun --show-sdk-path
      - name: Prepare pinned dependencies and tools
        run: make setup
      - name: Check formatting
        run: make format-check
      - name: Lint
        run: make lint

  test-build:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Record native toolchain
        run: |
          uname -m
          go version
          go env GOOS GOARCH CGO_ENABLED
          xcrun clang --version
          xcrun --show-sdk-path
      - name: Prepare pinned dependencies and tools
        run: make setup
      - name: Unit and regression tests
        run: make test
      - name: Build
        run: make build

  race:
    name: Race tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Record native toolchain
        run: |
          uname -m
          go version
          go env GOOS GOARCH CGO_ENABLED
          xcrun clang --version
          xcrun --show-sdk-path
      - name: Prepare pinned dependencies and tools
        run: make setup
      - name: Race tests
        run: make test-race
